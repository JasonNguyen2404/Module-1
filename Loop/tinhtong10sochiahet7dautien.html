<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tính tổng 10 số đầu tiên chia hết cho 7</h2>
    <p id="result"></p>
    <script>
        let count = 0;
        let sum = 0;
        let number = 0;
        while (count < 10) {
            if (number % 7 === 0) {
                sum += number;
                count++;
            }
            number++;
        }
        document.getElementById("result").innerHTML = "Tổng của 10 số đầu tiên chia hết cho 7 là: " + sum;
    </script>
</body>
</html>
