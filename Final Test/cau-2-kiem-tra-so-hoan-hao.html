<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiem tra so hoan hao</title>
</head>
<body>
<script>
    function isPerfectNumber(num) {
        if (num <= 1) return false;
        let sum = 0;
        for (let i = 1; i < num; i++) {
            if (num % i === 0) {
                sum += i;
            }
        }
        return sum === num;
    }

    const number = parseInt(prompt("Nhap mot so de kiem tra:"));
    if (isPerfectNumber(number)) {
        alert(number + " la so hoan hao.");
    } else {
        alert(number + " khong phai la so hoan hao.");
    }</script>
</body>
</html>
