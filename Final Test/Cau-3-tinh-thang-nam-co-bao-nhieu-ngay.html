<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiem tra so ngay</title>
</head>
<body>
<script>
    let input = prompt ("Nhập tháng/năm theo định dạng MM/YYYY");
    let regex = /^(0[1-9]|1[0-2])\/\d{4}$/;

    if (regex.test(input)) {
        let arr = input.split("/");
        let month = parseInt(arr[0]);
        let year = parseInt(arr[1]);
        let days;

        if (month === 1 || month === 3 || month === 5 ||
            month === 7 || month === 8 || month === 10 ||
            month === 12) {

            days = 31;
        } else if (month === 4 || month === 6 || month === 9 || month === 11) {
            days = 30;
        } else if (month === 2) {
            
            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
                days = 29;
            } else {
                days = 28;
            }
        }
    } else {
        alert("Định dạng tháng/năm không hợp lệ. Vui lòng nhập theo định dạng MM/YYYY.");
    }
</script>
</body>
</html>
</body>
</html>
